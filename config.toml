[model]
# Modèle du benchmark, installé et vérifié pour la démo midterms.
name = "qwen2.5:3b"
host = "http://localhost:11434"
temperature = 0.2
# Réglages CPU prudents : moins de mémoire et de charge pendant la soutenance.
num_ctx = 2048
num_predict = 128
num_thread = 2
num_batch = 64
timeout = 60

[assistant]
max_tool_iterations = 2
system_prompt = """
Tu es Sensai, l'assistant d'un cabinet médical. Tu tournes entièrement en local.
Réponds en français, de façon brève et factuelle.
Appuie-toi uniquement sur le dossier patient et les notices fournis dans le contexte, et cite tes sources.
Si l'information manque, dis-le au lieu de l'inventer.
Tu ne modifies jamais un dossier sans la validation explicite du médecin.
"""
